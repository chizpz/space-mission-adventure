<style>
  :root { --panel:#1c1035f2; --panel2:#2b1a4f; --line:#5a3d94; --txt:#f3eeff; --mut:#bdaee0; --acc:#5ff0d0; --gold:#ffc93c; --g:#3ddc84; --y:#ffd23f; --r:#ff6b6b; --btn:#ff7a3c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; width: 100%; position: fixed; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; background: #0a0514; font-family: 'Nunito', system-ui, 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; color: var(--txt); }
  canvas { display: block; touch-action: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
  button { font-family: inherit; cursor: pointer; color: inherit; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .hidden { display: none !important; }
  #ui { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }

  /* top bar */
  #topbar { position: absolute; top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #150b2be6; border-bottom: 2px solid var(--line); z-index: 5; }
  #tbTitle { font-weight: 900; letter-spacing: 1px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow { flex: 1; }
  .tb { background: var(--panel2); border-radius: 12px; padding: 5px 10px; font-weight: 900; font-size: 14px; white-space: nowrap; border: none; }
  #rank { border: 2px solid var(--line); padding: 3px 9px; }
  .xpbar { height: 16px; background: #3a2a66; border-radius: 8px; overflow: hidden; margin: 8px 0 4px; } .xpbar div { height: 100%; background: linear-gradient(90deg, #5ff0d0, #ffc93c); border-radius: 8px; }
  .rk-row { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid #3a2a66; font-size: 13px; font-weight: 800; } .rk-row.cur { color: var(--gold); } .rk-row.todo { opacity: .6; } .rk-row span:first-child { flex: 0 0 22px; } .rk-row span:nth-child(2) { flex: 1; }
  #credits { color: var(--gold); }
  #homeBtn { border: none; background: var(--btn); color: #fff; font-size: 16px; font-weight: 900; height: 40px; padding: 0 20px; border-radius: 14px; box-shadow: 0 3px 0 #a8431a; white-space: nowrap; }
  #topbar.inner #tbTitle, #topbar.inner .grow { display: none; }
  #topbar.inner #homeBtn { margin: 0 auto; }
  @media (min-width: 720px) { #topbar.inner #homeBtn { position: absolute; left: 50%; transform: translateX(-50%); margin: 0; } #topbar.inner #rank { margin-left: auto; } }
  svg.mi { vertical-align: -0.18em; flex: 0 0 auto; }
  .lost { opacity: .28; filter: grayscale(1); }
  .reqs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .req { border: 2px solid #3a2a66; background: transparent; color: var(--mut); border-radius: 10px; padding: 4px 9px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .req.g { border-color: #1e7a4a; background: #0f2f22; color: var(--g); box-shadow: 0 0 9px #3ddc8444; }
  .req.y { border-color: #8a7410; background: #33290a; color: var(--y); }
  .icon { border: none; background: var(--panel2); border-radius: 12px; width: 38px; height: 34px; font-size: 17px; }

  /* generic screens */
  .screen { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 14px 12px calc(20px + env(safe-area-inset-bottom)); background: #12081fcc; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 900; }
  h2 { margin: 0 0 6px; font-size: 19px; font-weight: 900; }
  h3 { margin: 10px 0 5px; font-size: 13px; font-weight: 900; color: var(--acc); text-transform: uppercase; letter-spacing: .6px; }
  p { margin: 5px 0; font-weight: 700; font-size: 14px; line-height: 1.45; }
  .mut { color: var(--mut); font-size: 12px; font-weight: 700; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { border: none; border-radius: 14px; padding: 11px 16px; font-size: 15px; font-weight: 900; color: #fff; background: var(--btn); box-shadow: 0 4px 0 #a8431a; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #a8431a; }
  .btn.blue { background: #7a4dff; box-shadow: 0 4px 0 #4b2bb0; }
  .btn.green { background: #1fae63; box-shadow: 0 4px 0 #12733f; }
  .btn.gray { background: #3a2a66; box-shadow: 0 4px 0 #241846; }
  .btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 11px; }
  .btn:disabled { opacity: .45; }
  .chip { display: inline-block; border-radius: 9px; padding: 2px 8px; font-size: 11px; font-weight: 900; background: #3a2a78; color: #e0d4ff; margin: 2px 3px 0 0; }
  .chip.gold { background: #5a4410; color: var(--gold); } .chip.g { background: #0f4a2c; color: #7dffb3; } .chip.r { background: #5a1a1a; color: #ffb0b0; } .chip.y { background: #56480c; color: #ffe27a; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .dot.g { background: var(--g); } .dot.y { background: var(--y); } .dot.r { background: var(--r); }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r1 = x => Math.round(x * 10) / 10;

// ---------- saved progress (localStorage) ----------
const SAVE_KEY = 'sma_save_v1';
function defaultSave() {
  return { v: 1, credits: 500, xp: 0, ownedRockets: ['thor'], rocket: 'thor', ownedParts: STARTERS.slice(),
    build: { engine: 'chem', hull: 'alu', fuel: 'small', thermal: [], radiation: [], software: ['basic'], nav: 'sun', solar: 'sp', battery: 'bat', comms: 'lga', science: [], landing: [] },
    paint: '#d2d6de', missions: { moon: { done: false, best: 0 }, mars: { done: false, best: 0 }, jupiter: { done: false, best: 0 } },
    settings: { sound: true, level: 2, players: 1, names: ['Player 1', 'Player 2', 'Player 3', 'Player 4'] },
    bestOpen: 0, flights: 0, target: 'moon', seenHowto: false, unlockAll: false };
}
let G = defaultSave();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return;
    const s = JSON.parse(raw); if (!s || s.v !== 1) return;
    const d = defaultSave();
    G = Object.assign(d, s);
    G.settings = Object.assign(defaultSave().settings, s.settings || {});
    G.missions = Object.assign(defaultSave().missions, s.missions || {});
    G.build = Object.assign(defaultSave().build, s.build || {});
    // drop anything unknown (keeps old saves safe after updates)
    G.ownedRockets = G.ownedRockets.filter(r => ROCKETS[r]); if (!G.ownedRockets.includes('thor')) G.ownedRockets.unshift('thor');   // the starter rocket is always owned
    if (!ROCKETS[G.rocket] || !G.ownedRockets.includes(G.rocket)) G.rocket = 'thor';
    G.ownedParts = G.ownedParts.filter(p => PART[p]);
    CATS.forEach(c => { if (c.multi) G.build[c.id] = (G.build[c.id] || []).filter(p => PART[p]); else if (!PART[G.build[c.id]]) G.build[c.id] = defaultSave().build[c.id]; });
    if (!G.build.software.includes('basic')) G.build.software.unshift('basic');
    if (!MISSIONS[G.target]) G.target = 'moon';
  } catch (e) { G = defaultSave(); }
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }

      const core = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.9, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
      const haze = new THREE.Mesh(new THREE.ConeGeometry(0.26, 1.3, 8), new THREE.MeshBasicMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0.35, depthWrite: false }));
      [core, haze].forEach(c => { c.rotation.z = side * Math.PI / 2; g.add(c); }); core.position.x = side * 0.45; haze.position.x = side * 0.65;   // cone tips point away from the hull

    if (R.fuel > e.fuel * 0.4) tips.push(`${Math.round(R.fuel / e.fuel * 100)}% of the fuel was left. A smaller tank would make the ship lighter.`);
    if (e.prod > e.use * 2.5) tips.push('The power source made far more than needed. A smaller one saves mass.');
    if (has('heat') && !m.entry) tips.push('The heat shield was dead weight here: there is no atmosphere to enter.');
    if (!m.entry && has('chute')) tips.push(`The parachute could not work on ${m.landOn || m.dest}: there is almost no air.`);
    const extra = CAT.science.parts.filter(p => !has(p.id)); if (extra.length && status === 'success') tips.push(`More instruments mean more science credits. Not on board: ${extra.slice(0, 3).map(p => p.name).join(', ')}.`);
    if (!e.crew && status === 'success') tips.push('A Crew Capsule earns 50% more, but it is heavy and needs radiation protection.');
    if (R.hits === 0 && status === 'success') causes.push('Flawless flying: no asteroid hits.');
    if (!causes.length) causes.push('Every system worked as planned.');
  }
  // ----- rewards
  if (R.traj === 'r' && status !== 'fail') tips.unshift('You launched on a red flight path and had to fight a gravity trap. Pick a green window next time.');
  const first = !G.missions[m.id].done, k = status === 'success' ? 1 : status === 'partial' ? 0.4 : 0;
  const baseR = Math.round(m.reward * k * (first ? 1 : 0.5) * (e.crew ? 1.5 : 1)), sciR = status === 'fail' ? 0 : Math.round(sci * 20 * m.stars), cleanR = status === 'success' && R.hits === 0 ? Math.round(m.reward * 0.1) : 0;
  const coinR = Math.round(R.coins * COIN_VALUE * R.mult), total = baseR + sciR + cleanR + coinR, xp = Math.round(m.xp * k) + Math.round(R.coins / 2);
  addCredits(total); const up = addXP(xp); if (status === 'success') G.missions[m.id].done = true; G.missions[m.id].best = Math.max(G.missions[m.id].best, total); persist(); renderTop();
  Sound.play(status === 'fail' ? 'fail' : status === 'success' ? 'win' : 'partial');
  const nextId = MISSION_ORDER[MISSION_ORDER.indexOf(m.id) + 1];
  const title = { success: '✅ Mission success!', partial: '⚠️ Partial success', fail: '❌ Mission failed' }[status], vc = { success: 'g', partial: 'y', fail: 'r' }[status];
  const report = status !== 'fail' && f > 0 ? b.science.map(id => `<li><b>${PART[id].name}:</b> ${m.facts[id]}</li>`).join('') : '';
  const stats = [
    trow('Rocket and load', `${Rk.name} · ${r1(e.mass)} / ${e.cap} mu (${Math.round(e.load)}%)`, 'cg'),
    trow('Thrust to mass / needed', `${e.tm.toFixed(2)} / ${m.tw}`, yel('thrust') ? 'cy' : 'cg'),
    trow('Fuel: tank / planned need / left', `${e.fuel} / ${r1(e.fuelNeed)} / ${r1(R.fuel)}`, R.fuel <= 0 ? 'cr' : ''),
    trow('Power: made / used', `${r1(e.prod)} / ${r1(e.use)} W`, e.prod >= e.use ? 'cg' : 'cr'),
    trow('Navigation: level / needed', `${e.nav} / ${m.nav}`, e.nav >= m.nav ? 'cg' : 'cy'),
    trow('Radiation: protection / needed', `${e.rad} / ${e.radNeed}`, e.rad >= e.radNeed ? 'cg' : 'cy'),
    trow('Hull: hits taken / strength', `${R.hits + (R.radDamage || 0)} / ${R.hpMax}`, R.hits ? 'cy' : 'cg'),
    R.landSpeed !== null ? trow('Touchdown speed / safe limit', `${R.landSpeed.toFixed(1)} / ${R.L.soft} m/s`, R.landSpeed <= R.L.soft ? 'cg' : 'cr') : '',
    m.id === 'jupiter' && R.O ? trow('Measurements near Europa', `${R.rings} / 5`, R.rings >= 4 ? 'cg' : 'cy') : '',
    trow('Science data returned', status === 'fail' ? '0' : `${sci} of ${e.data} (${Math.round(f * 100)}%)`, f >= 0.99 ? 'cg' : f > 0 ? 'cy' : 'cr'),
    trow('Flight time (game)', Math.round(R.flightTime) + ' s'),
  ].join('');
  $('resultsBox').innerHTML = `<div class="card"><span class="mut">${mIcon(m.id, 16)} ${m.name} · ${Rk.name}${e.crew ? ' · crewed' : ''}</span><p class="verdict ${vc}">${title}</p>
      <h2>+${total.toLocaleString('en-US')} 💰 credits · +${xp} XP</h2>
      ${status === 'success' && first && nextId ? `<p><span class="chip g">🔓 ${MISSIONS[nextId].name} unlocked</span></p>` : ''}${rankUpHtml(up)}
      ${status === 'partial' ? '<p class="mut">A partial success pays 40%. A full success is needed to unlock the next mission.</p>' : ''}
      <h3>${status === 'fail' ? 'What caused it' : status === 'partial' ? 'What went wrong' : 'Mission notes'}</h3>${ul(causes)}
      ${tips.length ? `<h3>${status === 'success' ? 'What you could do differently' : 'What to try next time'}</h3>${ul(tips.slice(0, 6))}` : ''}</div>
    ${report ? `<div class="card"><h3 style="margin-top:0">Science report from ${m.orbit ? 'Jupiter' : m.dest}${m.landOn ? ' and ' + m.landOn : ''}</h3><ul class="list">${report}</ul></div>` : ''}
    ${albumCard(m.id, status)}
    ${robotCard(m.id, R.landSpeed !== null && status !== 'fail')}
    <div class="card"><h3 style="margin-top:0">Statistics</h3><table>${stats}</table></div>
    <div class="card"><h3 style="margin-top:0">Reward</h3><table>${trow(`Mission (${status}${first ? '' : ', repeat flight 50%'}${e.crew ? ', crew x1.5' : ''})`, '+' + baseR)}${trow('Science data bonus', '+' + sciR)}${trow('Flawless hull bonus', '+' + cleanR)}${trow('Credits collected on the way', '+' + coinR)}${trow('<b>Total</b>', '<b>+' + total + '</b>')}</table></div>
    <div class="card"><div class="row">${status === 'success' && nextId ? `<button class="btn" data-act="next">${mIcon(nextId, 20)} Next: ${MISSIONS[nextId].name} ▶</button>` : ''}
      <button class="btn ${status === 'success' ? 'blue' : ''}" data-act="to-lab">🔧 ${status === 'success' ? 'Spacecraft Lab' : 'Fix it in the Lab'}</button><button class="btn blue" data-act="retry">🔁 Fly again</button><button class="btn gray" data-act="home">🏠 Menu</button></div></div>`;
  albumBind();
}
// =====================================================================
// 8. INPUT AND MAIN LOOP
// =====================================================================
const cv = renderer.domElement;
function steerFrom(ev) { if (stick.mode && ev.pointerType !== 'mouse') return;   // with the joystick, dragging on the screen does not steer
  target.x = (ev.clientX / innerWidth - 0.5) * 20; target.y = -(ev.clientY / innerHeight - 0.5) * 12; }
const steering = () => phase === 'cruise' || phase === 'orbit';
let cvTouch = false;
cv.addEventListener('pointerdown', ev => { pointer.down = true; pointer.x = ev.clientX; if (steering()) steerFrom(ev); });
window.addEventListener('pointermove', ev => {
  if (phase === 'menu' && pointer.down) { theta -= (ev.clientX - pointer.x) * 0.01; pointer.x = ev.clientX; }
  if (steering() && (pointer.down || ev.pointerType === 'mouse')) steerFrom(ev);
});
window.addEventListener('pointerup', ev => { if (ev.target === cv || ev.pointerType === 'mouse') pointer.down = false;
  if (ev.pointerType === 'mouse' && RUN) { RUN.boostHeld = false; RUN.burnHeld = false; } });
cv.addEventListener('pointercancel', () => { if (!cvTouch) pointer.down = false; });
// touch fallback: some phone browsers cancel pointer events during a long press
cv.addEventListener('touchstart', ev => { cvTouch = true; pointer.down = true; const t = ev.touches[0]; if (t) { pointer.x = t.clientX; if (steering()) steerFrom(t); } if (ev.cancelable) ev.preventDefault(); }, { passive: false });
cv.addEventListener('touchmove', ev => { const t = ev.touches[0]; if (t && steering()) steerFrom(t); if (ev.cancelable) ev.preventDefault(); }, { passive: false });
cv.addEventListener('touchend', ev => { if (!ev.targetTouches || ev.targetTouches.length === 0) pointer.down = false; });
cv.addEventListener('touchcancel', () => { pointer.down = false; });
cv.addEventListener('contextmenu', ev => ev.preventDefault());
// Safari on iPhone and iPad: no pinch zoom in the middle of a flight (double-tap zoom is switched off in the CSS)
['gesturestart', 'gesturechange', 'gestureend'].forEach(n => document.addEventListener(n, ev => ev.preventDefault(), { passive: false }));
window.addEventListener('keydown', ev => { if ((ev.key === 'p' || ev.key === 'P' || ev.key === 'Escape') && !ev.repeat) setPause(!paused);
  keys[ev.key] = true; if ((ev.key === ' ' || ev.key.startsWith('Arrow')) && phase !== 'menu' && phase !== 'results') ev.preventDefault(); });
window.addEventListener('keyup', ev => { keys[ev.key] = false; });
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- on-screen joystick for touch screens ----------
(function () {
  const el = $('stick'), knob = $('stickKnob'), RAD = 44;
  const move = (cx, cy) => { const r = el.getBoundingClientRect(); let dx = cx - (r.left + r.width / 2), dy = cy - (r.top + r.height / 2); const d = Math.hypot(dx, dy);
    if (d > RAD) { dx *= RAD / d; dy *= RAD / d; } if (stick.mode === 'x') dy = 0;
    stick.x = Math.abs(dx) < RAD * 0.14 ? 0 : dx / RAD; stick.y = Math.abs(dy) < RAD * 0.14 ? 0 : dy / RAD; knob.style.transform = `translate(${dx}px, ${dy}px)`; };
  const end = () => { stick.id = null; stick.x = stick.y = 0; knob.style.transform = ''; el.classList.remove('on'); };
  const find = ev => { for (let i = 0; i < ev.changedTouches.length; i++) if (ev.changedTouches[i].identifier === stick.id) return ev.changedTouches[i]; return null; };
  el.addEventListener('touchstart', ev => { const t = ev.changedTouches[0]; stick.id = t.identifier; el.classList.add('on'); move(t.clientX, t.clientY); if (ev.cancelable) ev.preventDefault(); }, { passive: false });
  el.addEventListener('touchmove', ev => { const t = find(ev); if (t) move(t.clientX, t.clientY); if (ev.cancelable) ev.preventDefault(); }, { passive: false });
  el.addEventListener('touchend', ev => { if (find(ev)) end(); }); el.addEventListener('touchcancel', ev => { if (find(ev)) end(); });
  let mouse = false;                           // a mouse also works, for laptops with touch screens
  el.addEventListener('mousedown', ev => { mouse = true; el.classList.add('on'); move(ev.clientX, ev.clientY); ev.preventDefault(); });
  window.addEventListener('mousemove', ev => { if (mouse) move(ev.clientX, ev.clientY); }); window.addEventListener('mouseup', () => { if (mouse) { mouse = false; end(); } });
  el.addEventListener('contextmenu', ev => ev.preventDefault());
})();

document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });   // leaving the tab pauses the flight

const clock = new THREE.Clock(), camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3(), lookNow = new THREE.Vector3(0, 4, 0);
let offsetOn = false;
function loop(dtOverride) {
  if (dtOverride === undefined) requestAnimationFrame(() => loop());
  const dt = dtOverride !== undefined ? dtOverride : Math.min(clock.getDelta(), 0.05);
  { const can = !!RUN && !RUN.over && FLYING.includes(phase), pb = $('pauseBtn'); if (pb._can !== can) { pb._can = can; pb.classList.toggle('hidden', !can); } }
  if (paused) { renderer.render(scene, camera); return; }
  Sound.tick(dt); updateSmoke(dt); seasonTick(dt); mapTick(dt); labTick();
  if (fadeV !== fadeGoal) { fadeV += clamp(fadeGoal - fadeV, -dt * 2.2, dt * 2.2); $('fade').style.opacity = fadeV; }
  for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; f.t += dt;
    f.parts.forEach(p => { p.position.addScaledVector(p.userData.v, dt); p.material.opacity = Math.max(0, 1 - f.t / 1.8); });
    f.flash.material.opacity = Math.max(0, 1 - f.t * 2); if (f.t > 2.2) { scene.remove(f.g); fx.splice(i, 1); } }
  debris.forEach(s => { s.position.addScaledVector(s.userData.vel, dt); s.userData.vel.y -= 9 * dt; s.rotation.z += s.userData.spin * dt; });
  // on phones the Lab sheet covers the lower half, so the 3D view is shifted up
  const wantOffset = view !== 'pad' && phase === 'menu' && innerWidth <= 860 && !!labComp;   // the parts sheet covers the lower half on phones
  if (wantOffset !== offsetOn) { offsetOn = wantOffset; if (wantOffset) camera.setViewOffset(innerWidth, innerHeight, 0, innerHeight * 0.2, innerWidth, innerHeight); else camera.clearViewOffset(); }

  if (phase === 'menu' || phase === 'results') {
    if (!pointer.down) theta += dt * 0.12;
    const H = padRocket ? padRocket.userData.height : 6;
    if (view === 'craft') { camGoal.set(PED.x + Math.sin(theta) * 8.5, 4.4, PED.z + Math.cos(theta) * 8.5); lookGoal.set(PED.x, 2.3, PED.z); }
    else if (view === 'rocket') { const d = 10 + H * 0.9; camGoal.set(Math.sin(theta) * d, 2.5 + H * 0.5, Math.cos(theta) * d); lookGoal.set(0, 0.5 + H * 0.48, 0); }
    else { const d = 17 + H * 0.9; camGoal.set(Math.sin(theta) * d, 7 + H * 0.3, Math.cos(theta) * d); lookGoal.set(2, 1 + H * 0.4, 1); }
    if (craftPreview) { craftPreview.rotation.y += dt * 0.35; pop = Math.min(1, pop + dt * 3.5); craftPreview.scale.setScalar(1 + Math.sin(pop * Math.PI) * 0.12); }
    if (phase === 'menu') { camera.position.lerp(camGoal, 0.06); lookNow.lerp(lookGoal, 0.08); camera.lookAt(lookNow); }
  } else if (phase === 'countdown') {
    const el = (performance.now() - RUN.t0) / 1000, n = 3 - Math.floor(el);
    $('count').textContent = n > 0 ? n : 'Liftoff!';
    rocketG.position.x = (Math.random() - .5) * 0.06;
    if (el > 2.2) launchSmoke(dt, Math.min(1, (el - 2.2) / 0.8));
    if (el > 2.2) rocketG.userData.stages[0].userData.flames.forEach(f => { f.visible = true; f.scale.y = 0.3 + Math.random() * 0.3; });
    const H = rocketG.userData.height, d = 12 + H * 0.6;
    camera.position.lerp(camGoal.set(Math.sin(theta) * d, 3 + H * 0.4, Math.cos(theta) * d), 0.08); camera.lookAt(0, H * 0.45, 0);
    if (el > 3.7 || dtOverride !== undefined) { $('count').classList.add('hidden'); phase = 'ascent'; }
  } else if (phase === 'ascent') updateAscent(dt);
  else if (phase === 'cruise') updateCruise(dt);
  else if (phase === 'approach') updateApproach(dt);
  else if (phase === 'entry') updateEntry(dt);
  else if (phase === 'landing') updateLanding(dt);
  else if (phase === 'insertion') updateInsertion(dt);
  else if (phase === 'orbit') updateOrbit(dt);
  else if (phase === 'deploy') updateDeploy(dt);
  extrasTick(dt);
  renderer.render(scene, camera);
}
loadSave(); setSeason(G.season || seasonOf(new Date())); refreshPad(); goMenu(); loop();
</script>
